- name: Verifica se postgresql está configurado
  ansible.builtin.stat:
    path: /var/lib/pgsql/initdb_postgresql.log
  register: pg_stat

- name: Configura postgresql
  when: not pg_stat.stat.exists
  block:

    - name: Inicializa postgresql
      ansible.builtin.command:
          cmd: postgresql-setup --initdb
          creates: /var/lib/pgsql/data/postgresql.conf 

    - name: Configura password_encryption para scram-sha-256
      ansible.builtin.lineinfile:
        path: /var/lib/pgsql/data/postgresql.conf
        regexp: '^#?password_encryption.*'
        line: 'password_encryption = scram-sha-256'

    - name: Configura permissão de acesso 
      ansible.builtin.blockinfile:
        path: /var/lib/pgsql/data/pg_hba.conf
        marker: "# {mark} Configuração de permissão de acesso. Não altere manualmente."
        insertbefore: BOF
        block: |
          # TYPE DATABASE    USER      ADDRESS         METHOD 
          host   all         all       0.0.0.0/0       scram-sha-256 

    - name: Habilitar e iniciar o serviço do PostgreSQL
      ansible.builtin.systemd_service:
        name: postgresql
        enabled: true
        state: started
      register: pg_status

    - name: Postgres status
      ansible.builtin.debug:
        var: pg_status

    - name: Criar usuário AWX
      become: true
      become_user: postgres
      community.postgresql.postgresql_user:
        name: awx
        password: "{{ awx_pg_password }}"
        role_attr_flags: NOSUPERUSER
        state: present
      no_log: true

    - name: Criar banco awx
      become: true
      become_user: postgres
      community.postgresql.postgresql_db:
        name: awx
        owner: awx
        state: present




